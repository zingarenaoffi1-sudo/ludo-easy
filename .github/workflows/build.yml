name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Keystore Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.DEBUG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.DEBUG_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > ~/.android/debug.keystore
          elif [ -f release_keystore_base64.txt ]; then
            cat release_keystore_base64.txt | tr -d '\r\n' | base64 -d > ~/.android/debug.keystore
          elif [ -f release.keystore ]; then
            cp release.keystore ~/.android/debug.keystore
          else
            echo "" | tr -d '\r\n' | base64 -d > ~/.android/debug.keystore
          fi
          cp ~/.android/debug.keystore ./debug.keystore
          cp ~/.android/debug.keystore ./release.keystore
          mkdir -p android/app
          cp ~/.android/debug.keystore android/app/debug.keystore
          cp ~/.android/debug.keystore android/app/release.keystore

          # Save signing credentials for Gradle (guarantee valid defaults)
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASSWORD:-android}" >> $GITHUB_ENV

      - name: Prepare Web Assets for Capacitor
        run: |
          rm -rf www
          node build.js

      - name: Install Capacitor & Mobile Dependencies
        run: |
          npm install --save-dev @capacitor/cli@^6.0.0
          npm install --save @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 @capacitor/app@^6.0.0

      - name: Initialize Capacitor Android Project
        run: |
          rm -rf android
          npx cap add android
          python3 prepare-android.py

      - name: Generate App Icons
        run: |
          if [ -f icon.png ]; then
            # Ensure imagemagick is available
            sudo apt-get update -y && sudo apt-get install -y imagemagick || true
            declare -A SIZES=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
            for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "android/app/src/main/res/mipmap-$dir"
              SZ=${SIZES[$dir]}
              if command -v convert >/dev/null 2>&1; then
                convert icon.png -resize "${SZ}x${SZ}!" PNG32:"android/app/src/main/res/mipmap-$dir/ic_launcher.png"
                convert icon.png -resize "${SZ}x${SZ}!" PNG32:"android/app/src/main/res/mipmap-$dir/ic_launcher_round.png"
                convert icon.png -resize "${SZ}x${SZ}!" PNG32:"android/app/src/main/res/mipmap-$dir/ic_launcher_foreground.png"
              else
                cp icon.png "android/app/src/main/res/mipmap-$dir/ic_launcher.png"
                cp icon.png "android/app/src/main/res/mipmap-$dir/ic_launcher_round.png"
                cp icon.png "android/app/src/main/res/mipmap-$dir/ic_launcher_foreground.png"
              fi
            done
            mkdir -p android/app/src/main/res/values
            echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0b0f19</color></resources>' > android/app/src/main/res/values/ic_launcher_background.xml
            mkdir -p android/app/src/main/res/mipmap-anydpi-v26
            echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          python3 prepare-android.py

      - name: Configure Gradle Environment
        run: |
          cp ~/.android/debug.keystore android/app/debug.keystore
          cp ~/.android/debug.keystore android/app/release.keystore
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.caching=false" >> android/gradle.properties
          chmod +x android/gradlew

      - name: Build Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --no-build-cache -x lint -x test --console=plain

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Ludo Zing Release v${{ github.run_number }}
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
